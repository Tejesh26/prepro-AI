# =============================================================================
#  PREPRO AI – Production Application Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Gemini AI Brain Configuration (Environment Variable Driven)
# Reads securely from host server environment ($GEMINI_API_KEY).
# -----------------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# -----------------------------------------------------------------------------
# 2. Database Persistence Configuration
# Allows seamless switching from embedded H2 to PostgreSQL/MySQL via $DB_URL.
# Default: File-based persistence in ./data/prepro_prod_db.
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/prepro_prod_db;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# -----------------------------------------------------------------------------
# 3. JPA / Hibernate Configuration
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# -----------------------------------------------------------------------------
# 4. Embedded H2 Console (Disabled in production unless DB_URL is H2)
# -----------------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# 5. Production Server & Port Configuration
# Supports cloud container PORT env variable (e.g. Heroku/AWS/Render/Docker).
# -----------------------------------------------------------------------------
server.port=${PORT:8082}

# -----------------------------------------------------------------------------
# 6. File Upload Limits (Syllabus PDF Security)
# Prevents server Denial-of-Service from oversized uploads.
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# -----------------------------------------------------------------------------
# 7. Logging Configuration
# -----------------------------------------------------------------------------
logging.level.com.tejesh.timetable=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
