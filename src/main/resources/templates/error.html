<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Error - PrePRO AI')}">
    <meta charset="UTF-8">
    <title>Error - PrePRO AI</title>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <!-- Top floating bar for theme toggle -->
    <div class="position-absolute top-0 end-0 p-3">
        <button type="button" id="themeToggleBtn" class="btn btn-ghost btn-icon-only" onclick="toggleTheme()" title="Toggle Theme (Light / Dark)">
            <i class="bi bi-moon-stars-fill text-secondary fs-5"></i>
        </button>
    </div>

    <!-- Error Card -->
    <div class="container animate-fade-in" style="max-width: 520px;">
        <div class="app-card app-card-elevated p-4 p-sm-5 text-center">
            
            <div class="stat-icon bg-danger-subtle text-danger mx-auto mb-3" style="width: 64px; height: 64px; font-size: 1.8rem; border-radius: 50%;">
                <i class="bi bi-exclamation-octagon-fill"></i>
            </div>

            <h3 class="fw-bold mb-2">Something Went Wrong</h3>
            <p class="text-muted small mb-4">
                We encountered an unexpected issue while processing your request. The safeguard has caught and logged the problem safely.
            </p>

            <div class="app-card p-3 bg-surface-secondary border text-start mb-4">
                <div class="small fw-semibold text-danger mb-1">
                    <i class="bi bi-bug me-1"></i> Error Details:
                </div>
                <div class="small text-muted font-monospace" th:text="${errorMessage}">
                    An unexpected system error occurred.
                </div>
                <div th:if="${errorPath}" class="small text-muted mt-2">
                    <strong>Endpoint:</strong> <code th:text="${errorPath}">/dashboard</code>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                    <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
                </a>
                <a th:href="@{/login}" class="btn btn-secondary px-3">
                    <i class="bi bi-box-arrow-in-left me-1"></i> Sign In
                </a>
            </div>

            <div class="mt-4 pt-3 text-center border-top" style="border-color: var(--border-color) !important;">
                <span class="text-muted small" style="font-size: 0.76rem;">
                    <i class="bi bi-cpu-fill text-primary me-1"></i> PrePRO AI &bull; Global Error Protection
                </span>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
