<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - PREPRO AI Study Planner</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 540px;
            width: 100%;
            padding: 40px 35px;
            text-align: center;
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #fee2e2;
            color: #dc2626;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="error-card">
        <div class="icon-circle">
            <i class="bi bi-exclamation-octagon-fill"></i>
        </div>

        <h3 class="fw-bold text-dark mb-2">Something Went Wrong</h3>
        <p class="text-muted small mb-4">
            We encountered an unexpected problem while processing your request. The issue has been safely logged.
        </p>

        <div class="alert alert-light border text-start p-3 mb-4 rounded-3">
            <div class="small fw-semibold text-danger mb-1">
                <i class="bi bi-bug me-1"></i> Error Details:
            </div>
            <div class="small text-muted font-monospace" th:text="${errorMessage}">
                An unexpected system error occurred.
            </div>
            <div th:if="${errorPath}" class="small text-secondary mt-2">
                <strong>Path:</strong> <code th:text="${errorPath}">/dashboard</code>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/dashboard}" class="btn btn-primary fw-semibold px-4">
                <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
            </a>
            <a th:href="@{/login}" class="btn btn-outline-secondary fw-semibold px-3">
                <i class="bi bi-box-arrow-in-left me-1"></i> Sign In
            </a>
        </div>

        <div class="mt-4 pt-3 text-center border-top">
            <span class="text-muted small"><i class="bi bi-cpu-fill text-primary me-1"></i> PREPRO AI Study Assistant &bull; Global Error Safeguard</span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
