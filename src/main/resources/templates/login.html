<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Sign In - PrePRO AI')}">
    <meta charset="UTF-8">
    <title>Sign In - PrePRO AI</title>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <!-- Top floating bar for theme toggle -->
    <div class="position-absolute top-0 end-0 p-3">
        <button type="button" id="themeToggleBtn" class="btn btn-ghost btn-icon-only" onclick="toggleTheme()" title="Toggle Theme (Light / Dark)">
            <i class="bi bi-moon-stars-fill text-secondary fs-5"></i>
        </button>
    </div>

    <!-- Main Login Card -->
    <div class="container animate-fade-in" style="max-width: 440px;">
        <div class="app-card app-card-elevated p-4 p-sm-5 text-center position-relative">

            <!-- Brand Icon & Header -->
            <div class="mb-4">
                <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                    <i class="bi bi-cpu-fill"></i>
                </div>
                <h3 class="fw-bold mb-1">Welcome Back</h3>
                <p class="text-muted small mb-0">Sign in to your personalized study assistant.</p>
            </div>

            <!-- Inline Notifications & Validation Messages -->
            <div th:if="${loginSuccess != null or param.success != null}" class="alert alert-success d-flex align-items-center gap-2 py-2 px-3 small rounded-3 text-start mb-3" role="alert">
                <i class="bi bi-check-circle-fill text-success fs-5"></i>
                <span th:text="${loginSuccess != null ? loginSuccess : 'Account created successfully! Please sign in.'}"></span>
            </div>

            <div th:if="${loginError != null or param.error != null}" class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 small rounded-3 text-start mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill text-danger fs-5"></i>
                <span th:text="${loginError != null ? loginError : 'Invalid student username or password. Please try again.'}"></span>
            </div>

            <div th:if="${loginInfo != null or param.logout != null}" class="alert alert-info d-flex align-items-center gap-2 py-2 px-3 small rounded-3 text-start mb-3" role="alert">
                <i class="bi bi-info-circle-fill text-primary fs-5"></i>
                <span th:text="${loginInfo != null ? loginInfo : 'You have been securely signed out.'}"></span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="text-start">
                <div class="mb-3">
                    <label for="username" class="form-label">Student Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="Enter your username">
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label mb-0">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                    </div>
                </div>

                <!-- One Prominent Primary Action -->
                <button type="submit" class="btn btn-primary w-100 py-2_5 fw-semibold mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                </button>

                <!-- Navigation link to Register -->
                <div class="text-center pt-2">
                    <span class="text-muted small">New to PrePRO AI?</span>
                    <a th:href="@{/register}" class="small fw-bold text-primary ms-1">Create an Account</a>
                </div>
            </form>

            <div class="mt-4 pt-3 text-center border-top" style="border-color: var(--border-color) !important;">
                <span class="text-muted small" style="font-size: 0.76rem;">
                    <i class="bi bi-shield-check text-success me-1"></i> BCrypt Encrypted &bull; CSRF Protected &bull; Enterprise Secure
                </span>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
