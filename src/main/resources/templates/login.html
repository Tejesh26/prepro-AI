<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PREPRO AI Study Planner</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 24px 16px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            max-width: 440px;
            width: 100%;
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge-brand {
            background-color: #eff6ff;
            color: #1d4ed8;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .btn-auth {
            background-color: var(--primary-blue);
            border: none;
            padding: 13px;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-auth:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="auth-card">
        <!-- Brand Header -->
        <div class="mb-4 text-center">
            <span class="badge-brand mb-2"><i class="bi bi-shield-lock-fill me-1"></i> SECURE ACCESS &bull; PREPRO AI</span>
            <h3 class="fw-bold text-dark mt-2 mb-1">Student Sign In</h3>
            <p class="text-muted small">Personalized study assistant with cognitive pacing &amp; automation.</p>
        </div>

        <!-- Success Notification -->
        <div th:if="${loginSuccess != null or param.success != null}" class="alert alert-success alert-dismissible fade show py-2 small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i>
            <span th:text="${loginSuccess != null ? loginSuccess : 'Account created successfully. Please log in.'}"></span>
            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
        </div>

        <!-- Error Notification -->
        <div th:if="${loginError != null or param.error != null}" class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            <span th:text="${loginError != null ? loginError : 'Invalid username or password. Please try again.'}"></span>
            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
        </div>

        <!-- Logout Notification -->
        <div th:if="${loginInfo != null or param.logout != null}" class="alert alert-info alert-dismissible fade show py-2 small" role="alert">
            <i class="bi bi-info-circle-fill me-1"></i>
            <span th:text="${loginInfo != null ? loginInfo : 'You have been securely signed out.'}"></span>
            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
        </div>

        <!-- Login Form with Automatic CSRF Token Injection -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small text-secondary">Student Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" id="username" name="username" value="Tejesh" required autofocus placeholder="Enter your username">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="password" name="password" value="password123" required placeholder="Enter your password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-auth w-100 text-white mb-3 shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
            </button>

            <!-- Bottom Link to Registration -->
            <div class="text-center pt-2">
                <span class="text-muted small">Don't have an account?</span>
                <a th:href="@{/register}" class="small fw-bold text-primary text-decoration-none ms-1">Create an Account</a>
            </div>
        </form>

        <div class="mt-4 pt-3 text-center border-top">
            <span class="text-muted small" style="font-size: 0.78rem;">
                <i class="bi bi-shield-check text-success me-1"></i> BCrypt Encrypted &bull; CSRF Protected &bull; Enterprise Secure
            </span>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
